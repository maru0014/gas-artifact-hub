<script>
  // 保存禁止や容量超過でも、画面の操作はこのページ内のメモリで継続する。
  const memoryStorage_ = Object.create(null);
  function readStorage_(key) {
    if (Object.prototype.hasOwnProperty.call(memoryStorage_, key)) return memoryStorage_[key];
    try { return localStorage.getItem(key); } catch (error) { return null; }
  }
  function writeStorage_(key, value) {
    memoryStorage_[key] = String(value);
    try { localStorage.setItem(key, String(value)); } catch (error) { /* 保存できない環境ではページ内のみ保持 */ }
  }


  const dialogStack_ = [];
  function showDialog_(id) {
    const dialog = document.getElementById(id);
    if (!dialog) return;
    if (!dialog.classList.contains('show')) {
      dialog._previousFocus = document.activeElement;
      dialogStack_.push(id);
    }
    dialog.classList.add('show');
    dialog.inert = false;
    dialog.setAttribute('tabindex', '-1');
    const first = dialog.querySelector('button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), a[href]');
    (first || dialog).focus();
  }
  function hideDialog_(id) {
    const dialog = document.getElementById(id);
    if (!dialog) return;
    const wasShown = dialog.classList.contains('show');
    dialog.classList.remove('show');
    dialog.inert = true;
    const index = dialogStack_.lastIndexOf(id);
    if (index >= 0) dialogStack_.splice(index, 1);
    if (wasShown && dialog._previousFocus && dialog._previousFocus.isConnected) dialog._previousFocus.focus();
    if (wasShown) dialog._previousFocus = null;
  }
  function setupDialogKeyboard_() {
    document.addEventListener('keydown', function (event) {
      if (event.key !== 'Tab') return;
      const id = dialogStack_[dialogStack_.length - 1];
      const dialog = id && document.getElementById(id);
      if (!dialog || !dialog.classList.contains('show')) return;
      const focusable = Array.from(dialog.querySelectorAll('button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), a[href], [tabindex="0"]')).filter(el => el.getClientRects().length);
      if (!focusable.length) { event.preventDefault(); dialog.focus(); return; }
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && (document.activeElement === first || !dialog.contains(document.activeElement))) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && (document.activeElement === last || !dialog.contains(document.activeElement))) { event.preventDefault(); first.focus(); }
    });
  }
  function setDialogDisabled_(id, disabled) {
    document.getElementById(id).querySelectorAll('input, textarea, select, button:not([data-dialog-close])').forEach(el => { el.disabled = disabled; });
  }
  function copyText_(text, successMessage, promptMessage) {
    var copiedMessage = successMessage || '共有リンクをコピーしました';
    var manualMessage = promptMessage || '次のURLをコピーしてください';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => showToast(copiedMessage)).catch(() => window.prompt(manualMessage, text));
    } else { window.prompt(manualMessage, text); }
  }

  var appConfig = {
    userEmail: '',
    maxHtmlSizeKb: 1024,
    systemEnabled: true
  };

  var uploadState = {
    file: null,
    htmlContent: '',
    fileReadId: 0,
    busy: false,
    isUpdateMode: false,
    updateArtifactId: '',
    selectedAcl: 'all'
  };

  var currentArtifacts = [];
  var activeCategory = 'all';
  var listRequestId_ = 0;
  var searchTimer_;
  var activeViewMode_ = 'grid';

  /**
   * script.google.com の正規URLかどうかを厳格に検証（オープンリダイレクト防止）
   */
  function isValidScriptAppUrl(url) {
    if (!url || typeof url !== 'string') return false;
    return /^https:\/\/(?:[a-zA-Z0-9-]+\.)*script\.google\.com(?::\d+)?\//i.test(url);
  }

  function getAppBaseUrl() {
    var rawUrl = '';

    // 1. 同一オリジンの場合、最上位ウィンドウ（window.top）のURLを直接取得
    try {
      if (window.top && window.top.location && window.top.location.href) {
        var topHref = window.top.location.href;
        if (isValidScriptAppUrl(topHref)) {
          rawUrl = topHref;
        }
      }
    } catch (e) {}

    // 2. document.referrer が script.google.com の場合
    if (!rawUrl) {
      try {
        if (isValidScriptAppUrl(document.referrer)) {
          rawUrl = document.referrer;
        }
      } catch (e) {}
    }

    // 3. サーバーから渡された URL (ScriptApp.getService().getUrl())
    if (!rawUrl && typeof APP_URL !== 'undefined' && APP_URL) {
      rawUrl = String(APP_URL).trim().replace(/^["']+|["']+$/g, '');
    }

    // 4. フォールバック
    if (!rawUrl) {
      rawUrl = window.location.origin + window.location.pathname;
    }

    return rawUrl.split('?')[0].split('#')[0];
  }

  function getViewerUrl(artifactId) {
    var base = getAppBaseUrl();
    var sep = base.indexOf('?') === -1 ? '?' : '&';
    return base + sep + 'a=' + encodeURIComponent(artifactId);
  }

  function launchViewer(url) {
    if (!url) return;
    try {
      if (window.top) {
        window.top.location.href = url;
        return;
      }
    } catch (e) {
      try {
        window.open(url, '_top');
        return;
      } catch (e2) {}
    }
    window.location.href = url;
  }

  window.addEventListener('DOMContentLoaded', function () {
    setupDialogKeyboard_();
    // テーマ初期化
    var savedTheme = readStorage_('hub_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    setupEventListeners();
    setupUpdateDropzone();
    setupChangeNoteCounter_();
    bootstrapApp();
  });

  function toggleTheme() {
    var html = document.documentElement;
    var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    writeStorage_('hub_theme', next);
  }

  function preferenceKey_(name) {
    return name + '_' + (appConfig.userEmail || 'guest').toLowerCase();
  }

  function initUserPreferences_() {
    initRiskNotice_();
    var savedViewMode = readStorage_(preferenceKey_('hub_view_mode')) || 'grid';
    switchViewMode(savedViewMode, true);
  }

  function initRiskNotice_() {
    var isCollapsed = readStorage_(preferenceKey_('hub_risk_notice_collapsed')) === 'true';
    applyRiskNoticeState_(isCollapsed);
  }

  function toggleRiskNotice() {
    var banner = document.getElementById('riskNoticeBanner');
    if (!banner) return;
    var isCurrentlyCollapsed = banner.classList.contains('is-collapsed');
    var nextCollapsed = !isCurrentlyCollapsed;
    applyRiskNoticeState_(nextCollapsed);
    writeStorage_(preferenceKey_('hub_risk_notice_collapsed'), String(nextCollapsed));
  }

  function applyRiskNoticeState_(collapsed) {
    var banner = document.getElementById('riskNoticeBanner');
    var btn = document.getElementById('btnRiskToggle');
    var text = document.getElementById('riskToggleText');
    if (!banner || !btn) return;
    if (collapsed) {
      banner.classList.add('is-collapsed');
      btn.setAttribute('aria-expanded', 'false');
      btn.setAttribute('aria-label', 'セキュリティ注意表示を展開する');
      if (text) text.textContent = '詳細を表示';
    } else {
      banner.classList.remove('is-collapsed');
      btn.setAttribute('aria-expanded', 'true');
      btn.setAttribute('aria-label', 'セキュリティ注意表示を折りたたむ');
      if (text) text.textContent = '折りたたむ';
    }
  }







  function applyConfig(cfg) {
    if (!cfg) return;
    appConfig = cfg;
    initUserPreferences_();
    var email = appConfig.userEmail || '';
    document.getElementById('user-email-display').textContent = email || 'ゲスト (未認証)';
    var initial = email ? email.charAt(0).toUpperCase() : '?';
    document.getElementById('user-avatar').textContent = initial;
    var dropHint = document.getElementById('drop-size-hint');
    if (dropHint) {
      dropHint.textContent = '単一HTMLを検査して組織内で共有します (最大 ' + appConfig.maxHtmlSizeKb + ' KB)';
    }
  }

  function renderSkeletonView() {
    var gridView = document.getElementById('gridView');
    var tableBody = document.getElementById('tableBody');

    var singleCard = [
      '<div class="skeleton-card">',
      '  <div class="skeleton-head">',
      '    <div class="skeleton-title-group">',
      '      <div class="skeleton-title skeleton-shimmer"></div>',
      '      <div class="skeleton-id skeleton-shimmer"></div>',
      '    </div>',
      '    <div class="skeleton-badge skeleton-shimmer"></div>',
      '  </div>',
      '  <div class="skeleton-desc">',
      '    <div class="skeleton-line skeleton-shimmer"></div>',
      '    <div class="skeleton-line short skeleton-shimmer"></div>',
      '  </div>',
      '  <div class="skeleton-foot">',
      '    <div class="skeleton-author">',
      '      <div class="skeleton-avatar skeleton-shimmer"></div>',
      '      <div class="skeleton-author-name skeleton-shimmer"></div>',
      '    </div>',
      '    <div class="skeleton-btn skeleton-shimmer"></div>',
      '  </div>',
      '</div>'
    ].join('');

    var singleRow = [
      '<tr class="skeleton-row">',
      '  <td><div class="skeleton-cell-bar skeleton-shimmer" style="width: 70%;"></div></td>',
      '  <td><div class="skeleton-cell-bar skeleton-shimmer" style="width: 60px;"></div></td>',
      '  <td><div class="skeleton-cell-bar skeleton-shimmer" style="width: 80px;"></div></td>',
      '  <td><div class="skeleton-cell-bar skeleton-shimmer" style="width: 70px;"></div></td>',
      '  <td style="text-align: right;"><div class="skeleton-cell-bar skeleton-shimmer" style="width: 50px; margin-left: auto;"></div></td>',
      '</tr>'
    ].join('');

    if (gridView) {
      gridView.innerHTML = singleCard + singleCard + singleCard + singleCard + singleCard + singleCard;
    }
    if (tableBody) {
      tableBody.innerHTML = singleRow + singleRow + singleRow + singleRow + singleRow;
    }
  }

  function bootstrapApp() {
    // HTMLの殻を先に表示し、設定と一覧は一度のRPCで取得する。
    loadArtifactList();
  }

  function setupEventListeners() {
    // 全画面ドラッグ＆ドロップ
    var dropOverlay = document.getElementById('dropOverlay');

    window.addEventListener('dragover', function (e) {
      e.preventDefault();
      dropOverlay.classList.add('active');
    });

    window.addEventListener('dragleave', function (e) {
      if (e.relatedTarget === null) {
        dropOverlay.classList.remove('active');
      }
    });

    window.addEventListener('drop', function (e) {
      e.preventDefault();
      dropOverlay.classList.remove('active');
      var files = e.dataTransfer.files;
      if (files && files.length > 0) {
        if (document.getElementById('drawer').classList.contains('show')) processFile(files[0]);
        else openDrawer(false, null, files[0]);
      }
    });

    // キーボードショートカット (⌘K / Ctrl+K, Escape)
    window.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        var searchInput = document.getElementById('searchInput');
        searchInput.focus();
        searchInput.select();
      }
      if (e.key === 'Escape') {
        var top = dialogStack_[dialogStack_.length - 1];
        if (top === 'uploadModal') closeNewVersionModal();
        else if (top === 'settingsModal') closeSettingsModal();
        else closeDrawer();
      }
    });

  }

  function setBusyState_(busy) {
    var val = busy ? 'true' : 'false';
    var contentArea = document.getElementById('contentArea');
    if (contentArea) contentArea.setAttribute('aria-busy', val);
    var gridView = document.getElementById('gridView');
    if (gridView) gridView.setAttribute('aria-busy', val);
    var listView = document.getElementById('listView');
    if (listView) listView.setAttribute('aria-busy', val);
  }

  function formatTime_(date) {
    var d = date || new Date();
    var h = ('0' + d.getHours()).slice(-2);
    var m = ('0' + d.getMinutes()).slice(-2);
    var s = ('0' + d.getSeconds()).slice(-2);
    return h + ':' + m + ':' + s;
  }

  function loadArtifactList(showSkeleton, onComplete) {
    const requestId = ++listRequestId_;
    const status = document.getElementById('status-message');
    const refresh = document.getElementById('btnRefreshList');
    status.style.display = 'none';
    refresh.classList.add('is-refreshing');
    refresh.disabled = true;
    setBusyState_(true);
    if (!currentArtifacts.length || showSkeleton) renderSkeletonView();
    function finish(error) {
      refresh.classList.remove('is-refreshing');
      refresh.disabled = false;
      setBusyState_(false);
      renderArtifacts(currentArtifacts);
      var lastUpdated = document.getElementById('lastUpdatedStatus');
      if (lastUpdated) {
        lastUpdated.textContent = error ? '更新失敗' : '最終更新: ' + formatTime_();
      }
      if (error) { status.textContent = error + ' 「最新の状態に更新」で再試行できます。'; status.style.display = 'block'; }
      if (typeof onComplete === 'function') onComplete();
    }
    google.script.run.withSuccessHandler(function (res) {
      if (requestId !== listRequestId_) return;
      if (!res || !res.ok) { finish('一覧取得エラー: ' + ((res && res.error) || '応答を取得できませんでした')); return; }
      if (res.data && res.data.config) applyConfig(res.data.config);
      currentArtifacts = res.data && Array.isArray(res.data.artifacts) ? res.data.artifacts : [];
      updateBadgeCounts(currentArtifacts);
      finish();
    }).withFailureHandler(function (error) {
      if (requestId !== listRequestId_) return;
      finish('通信エラー: ' + error.message);
    }).apiGetInitialData();
  }

  function updateBadgeCounts(list) {
    var myEmail = (appConfig.userEmail || '').toLowerCase();
    var allCount = list.length;
    var myCount = 0;
    var favCount = 0;
    var dataCount = 0;
    var textCount = 0;
    var devCount = 0;

    var favs = getFavorites();

    list.forEach(function (a) {
      var isOwner = (a.createdBy || '').toLowerCase() === myEmail;
      if (isOwner) myCount++;
      if (favs.indexOf(a.artifactId) !== -1) favCount++;

      var text = ((a.title || '') + ' ' + (a.description || '')).toLowerCase();
      if (text.match(/data|csv|tsv|分析|チャート|グラフ|スプレッドシート|売上/i)) dataCount++;
      else if (text.match(/text|文書|議事録|要約|マークダウン|markdown|辞書/i)) textCount++;
      else devCount++;
    });

    document.getElementById('badgeAllCount').textContent = allCount;
    document.getElementById('badgeFavCount').textContent = favCount;
    document.getElementById('badgeMyCount').textContent = myCount;
    document.getElementById('badgeDataCount').textContent = dataCount;
    document.getElementById('badgeTextCount').textContent = textCount;
    document.getElementById('badgeDevCount').textContent = devCount;
  }

  function renderArtifacts(list) {
    var gridView = document.getElementById('gridView');
    var tableBody = document.getElementById('tableBody');
    gridView.innerHTML = '';
    tableBody.innerHTML = '';

    if (!list || list.length === 0) {
      var emptyMsg = '<div style="padding: 40px; text-align: center; color: var(--text-sub); grid-column: 1/-1;">公開中のアーティファクトはありません。「アーティファクトを共有」から最初のアーティファクトを投稿してみましょう！</div>';
      gridView.innerHTML = emptyMsg;
      tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 32px; color: var(--text-sub);">アーティファクトがありません</td></tr>';
      document.getElementById('filteredCount').textContent = '0 件';
      return;
    }

    var myEmail = (appConfig.userEmail || '').toLowerCase();
    var favs = getFavorites();
    var q = document.getElementById('searchInput').value.toLowerCase().trim();
    var visibleCount = 0;

    list.forEach(function (art) {
      var titleLower = (art.title || '').toLowerCase();
      var descLower = (art.description || '').toLowerCase();
      var authorEmail = (art.createdBy || '').toLowerCase();
      var authorName = authorEmail ? authorEmail.split('@')[0] : '不明';
      var isOwner = !!art.isEditor;
      var isFav = favs.indexOf(art.artifactId) !== -1;

      // カテゴリ判定
      var cat = 'dev';
      var combined = titleLower + ' ' + descLower;
      if (combined.match(/data|csv|tsv|分析|チャート|グラフ|スプレッドシート|売上/i)) cat = 'data';
      else if (combined.match(/text|文書|議事録|要約|マークダウン|markdown|辞書/i)) cat = 'text';

      // フィルター条件
      var matchesCategory = (
        activeCategory === 'all' ||
        (activeCategory === 'fav' && isFav) ||
        (activeCategory === 'my' && isOwner) ||
        (activeCategory === cat)
      );

      var matchesSearch = !q || (titleLower.indexOf(q) !== -1 || descLower.indexOf(q) !== -1 || art.artifactId.toLowerCase().indexOf(q) !== -1 || authorName.indexOf(q) !== -1);

      if (!matchesCategory || !matchesSearch) {
        return;
      }
      visibleCount++;

      var viewerUrl = getViewerUrl(art.artifactId);
      var updatedDate = art.updatedAt ? new Date(art.updatedAt).toLocaleDateString('ja-JP') : '';
      var visibility = art.visibility === 'all' || art.visibility === 'list' || art.visibility === 'private' ? art.visibility : 'private';
      var visText = visibility === 'all' ? '全社公開' : (visibility === 'list' ? '限定公開' : '自分のみ');
      var visClass = 'badge-visibility-' + visibility;
      var visIcon = '';
      if (visibility === 'all') {
        visIcon = '<svg class="icon" style="width: 11px; height: 11px;" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>';
      } else if (visibility === 'list') {
        visIcon = '<svg class="icon" style="width: 11px; height: 11px;" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
      } else {
        visIcon = '<svg class="icon" style="width: 11px; height: 11px;" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
      }
      var visBadgeHtml = `<span class="badge-visibility ${visClass}">${visIcon}<span>${escapeHtml(visText)}</span></span>`;

      var descHtml = (art.description && art.description.trim()) ?
        `<p class="card-desc" tabindex="0" aria-label="説明: ${escapeHtml(art.description)}">${escapeHtml(art.description)}</p>` :
        `<p class="card-desc is-empty" title="説明はありません">説明はありません</p>`;

      var editBtnHtml = isOwner ?
        `<button type="button" class="btn-action-ghost" data-settings-artifact-id="${escapeHtml(art.artifactId)}" onclick="event.stopPropagation(); openEditModal('${escapeHtml(art.artifactId)}')" title="編集" aria-label="編集">編集</button>` : '';

      var favLabel = isFav ? 'お気に入りから解除' : 'お気に入りに追加';
      var favIcon = isFav ?
        '<svg class="icon" style="width: 13px; height: 13px; color: #d97706; fill: #d97706;" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' :
        '<svg class="icon" style="width: 13px; height: 13px;" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';

      var favBtnHtml = `
        <button type="button" class="btn-action-ghost ${isFav ? 'is-active' : ''}" style="padding: 0 8px;" onclick="event.stopPropagation(); toggleFavorite('${escapeHtml(art.artifactId)}')" title="${favLabel}" aria-label="${favLabel}" aria-pressed="${isFav ? 'true' : 'false'}">
          ${favIcon}
          <span class="btn-label-text">${isFav ? '登録済' : 'お気に入り'}</span>
        </button>
      `;

      var shareBtnHtml = `
        <button type="button" class="btn-action-ghost" style="padding: 0 8px;" onclick="event.stopPropagation(); copyLink('${escapeHtml(art.artifactId)}')" title="共有リンクをコピー" aria-label="共有リンクをコピー">
          <svg class="icon" style="width: 13px; height: 13px;" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <span class="btn-label-text">共有</span>
        </button>
      `;

      // 1. グリッドカード作成
      var card = document.createElement('div');
      card.className = 'card';

      if (activeViewMode_ === 'grid') {
      card.innerHTML = `
        <div class="card-head">
          <div class="card-title-group">
            <h2 class="card-title">${escapeHtml(art.title || '名称未設定')}</h2>
          </div>
          ${visBadgeHtml}
        </div>
        ${descHtml}
        <div class="card-foot">
          <div class="author-info">
            <div class="avatar" style="width: 18px; height: 18px; font-size: 9px;">${escapeHtml(authorName.charAt(0).toUpperCase())}</div>
            <span>${escapeHtml(authorName)} · ${escapeHtml(updatedDate)}</span>
          </div>
          <div class="card-actions">
            ${favBtnHtml}
            ${shareBtnHtml}
            ${editBtnHtml}
            <a href="${escapeHtml(viewerUrl)}" target="_top" class="btn-action-primary" onclick="event.stopPropagation(); launchViewer(this.href); return false;" aria-label="${escapeHtml(art.title || '名称未設定')}を起動">起動</a>
          </div>
        </div>
      `;
      gridView.appendChild(card);
      }

      if (activeViewMode_ === 'list') {
      // 2. テーブル行作成
      var tr = document.createElement('tr');
      tr.className = 'table-row';
      tr.innerHTML = `
        <td class="col-name">
          <div style="font-weight: 600; color: var(--text);">${escapeHtml(art.title || '名称未設定')}</div>
          <div class="table-desc-text" tabindex="0" aria-label="説明: ${escapeHtml(art.description || '説明なし')}">${escapeHtml(art.description || '説明なし')}</div>
        </td>
        <td class="col-vis">${visBadgeHtml}</td>
        <td class="col-author">${escapeHtml(authorName)}</td>
        <td class="col-updated">${escapeHtml(updatedDate)}</td>
        <td class="col-actions" style="text-align: right;">
          <div style="display: inline-flex; gap: 4px; align-items: center; justify-content: flex-end;">
            <button type="button" class="btn-action-ghost ${isFav ? 'is-active' : ''}" style="padding: 0 6px;" onclick="toggleFavorite('${escapeHtml(art.artifactId)}')" title="${favLabel}" aria-label="${favLabel}" aria-pressed="${isFav ? 'true' : 'false'}">
              ${favIcon}
            </button>
            <button type="button" class="btn-action-ghost" style="padding: 0 6px;" onclick="copyLink('${escapeHtml(art.artifactId)}')" title="共有リンクをコピー" aria-label="共有リンクをコピー">

  // お気に入りローカル管理
  function getFavorites() {
    try {
      const value = JSON.parse(readStorage_('hub_favorites_' + (appConfig.userEmail || '')) || '[]');
      return Array.isArray(value) ? value.filter(id => typeof id === 'string') : [];
    } catch (error) { return []; }
  }
  function toggleFavorite(id) {
    var favs = getFavorites();
    var idx = favs.indexOf(id);
    if (idx === -1) {
      favs.push(id);
      showToast('お気に入りに追加しました');
    } else {
      favs.splice(idx, 1);
      showToast('お気に入りを解除しました');
    }
    writeStorage_('hub_favorites_' + (appConfig.userEmail || ''), JSON.stringify(favs));
    updateBadgeCounts(currentArtifacts);
    renderArtifacts(currentArtifacts);
  }

  // 検索
  function handleSearch() {
    clearTimeout(searchTimer_);
    searchTimer_ = setTimeout(() => renderArtifacts(currentArtifacts), 120);
  }

  // カテゴリ選択
  function setCategoryFilter(cat, el) {
    activeCategory = cat;
    document.querySelectorAll('.nav-item').forEach(function (item) {
      item.classList.remove('active');
    });
    el.classList.add('active');
    document.getElementById('currentSectionTitle').textContent = el.querySelector('span').textContent;

  // 表示モード切替 (grid / list)
  function switchViewMode(mode, skipSave) {
    activeViewMode_ = mode === 'list' ? 'list' : 'grid';
    var gridView = document.getElementById('gridView');
    var listView = document.getElementById('listView');
    var btnGrid = document.getElementById('btnGrid');
    var btnList = document.getElementById('btnList');

    if (activeViewMode_ === 'grid') {
      if (gridView) gridView.style.display = 'grid';
      if (listView) listView.style.display = 'none';
      if (btnGrid) btnGrid.classList.add('active');
      if (btnList) btnList.classList.remove('active');
    } else {
      if (gridView) gridView.style.display = 'none';
      if (listView) listView.style.display = 'block';
      if (btnGrid) btnGrid.classList.remove('active');
      if (btnList) btnList.classList.add('active');
    }
    if (btnGrid) btnGrid.setAttribute('aria-pressed', activeViewMode_ === 'grid');
    if (btnList) btnList.setAttribute('aria-pressed', activeViewMode_ === 'list');
    if (!skipSave) {
      writeStorage_(preferenceKey_('hub_view_mode'), activeViewMode_);
    }
    renderArtifacts(currentArtifacts);
  }

  // Drawer (アップロード / 更新)
  function openDrawer(isUpdate, artifactId, preselectedFile) {
    if (uploadState.busy) return;
    uploadState.isUpdateMode = !!isUpdate;
    uploadState.updateArtifactId = artifactId || '';

    var titleLabel = document.getElementById('drawerHeaderTitle');
    var visField = document.getElementById('visibility-field');


    if (isUpdate) {
      titleLabel.textContent = '新バージョンの投稿 (' + artifactId + ')';

    } else {

  function closeDrawer() {
    if (uploadState.busy) return;

    hideDialog_('drawer');

  function clearDrawerInputs() {
    ++uploadState.fileReadId;
    uploadState.file = null;
    uploadState.htmlContent = '';

    document.getElementById('input-title').value = '';
    document.getElementById('input-desc').value = '';
    document.getElementById('input-principals').value = '';

    document.getElementById('selected-file-sub').textContent = 'クリックしてファイルを選択';

  function handleFileInputChange(files) {
    if (files && files.length > 0) {
      processFile(files[0]);
    }
  }

  function resetFilePreview_() {
    document.getElementById('selected-file-label').textContent = 'HTMLファイルを選択またはドロップ';
    document.getElementById('selected-file-sub').textContent = 'クリックしてファイルを選択';
    var card = document.getElementById('scanSummaryCard');
    if (card) card.style.display = 'none';
  }

  function processFile(file) {
    if (uploadState.busy) return;
    const readId = ++uploadState.fileReadId;
    uploadState.htmlContent = '';
    uploadState.file = null;
    document.getElementById('btn-submit-upload').disabled = true;
    if (!file.name.match(/\.(html|htm)$/i)) {
      showToast('単一のHTMLファイル (.html / .htm) を選択してください');
      resetFilePreview_();
      return;
    }

    var maxBytes = appConfig.maxHtmlSizeKb * 1024;
    if (file.size > maxBytes) {
      showToast('ファイルサイズ (' + Math.round(file.size / 1024) + ' KB) が上限を超えています');
      resetFilePreview_();
      return;
    }

    uploadState.file = file;
    document.getElementById('selected-file-label').textContent = file.name;
    document.getElementById('selected-file-sub').textContent = Math.round(file.size / 1024) + ' KB · 準備完了';

    var reader = new FileReader();
    reader.onload = function (e) {
      if (readId !== uploadState.fileReadId) return;
      uploadState.htmlContent = e.target.result;

      // タイトル自動補完
      var titleInput = document.getElementById('input-title');
      if (!titleInput.value) {
        titleInput.value = file.name.replace(/\.[^/.]+$/, '');
      }

      // クライアント側簡易スキャンプレビュー
      previewScanResult(uploadState.htmlContent, file.size);
      document.getElementById('btn-submit-upload').disabled = false;
    };
    reader.onerror = reader.onabort = function () {
      if (readId !== uploadState.fileReadId) return;
      uploadState.htmlContent = '';
      document.getElementById('btn-submit-upload').disabled = true;
      showToast('ファイルの読み込みに失敗しました。再選択してください');
    };
    reader.readAsText(file);
  }

  function previewScanResult(html, sizeBytes) {
    var card = document.getElementById('scanSummaryCard');
    card.style.display = 'block';

    document.getElementById('scan-filesize').textContent = (sizeBytes / 1024).toFixed(1) + ' KB (' + (sizeBytes <= 90 * 1024 ? '高速キャッシュ適用' : 'Drive直読み') + ')';

    var hasNetwork = html.match(/\b(fetch|XMLHttpRequest|WebSocket|sendBeacon|EventSource)\b/i);
    var networkEl = document.getElementById('scan-network-status');
    if (hasNetwork) {
      networkEl.textContent = '外部通信API検出あり';
      networkEl.style.color = 'var(--badge-warn-text)';
    } else {
      networkEl.textContent = '検出なし（安全性の保証ではありません）';
      networkEl.style.color = 'var(--badge-safe-text)';
    }

    document.getElementById('scan-auth-status').textContent = '親画面から分離して実行';
    document.getElementById('scan-status-title').textContent = '簡易検査プレビュー';
  }

  function selectAcl(acl) {
    uploadState.selectedAcl = acl;
    ['all', 'list', 'private'].forEach(function (k) {
      var el = document.getElementById('acl-' + k);
      if (el) el.classList.toggle('selected', k === acl);
    });
    document.getElementById('principals-group').style.display = acl === 'list' ? 'block' : 'none';
  }

  function handleSubmitUpload() {
    if (uploadState.busy) return;
    if (!uploadState.htmlContent) {
      showToast('HTMLファイルを選択してください');
      return;
    }

    var btn = document.getElementById('btn-submit-upload');
    btn.disabled = true;
    btn.textContent = '公開処理中...';
    uploadState.busy = true;

    if (uploadState.isUpdateMode) {
      // 新バージョン更新
      google.script.run
        .withSuccessHandler(function (res) {
          uploadState.busy = false;
        btn.disabled = false;
          btn.textContent = '社内へ公開する';
          if (!res.ok) {
            showToast('更新失敗: ' + res.error);
            return;
          }
          closeDrawer();
          showToast('新バージョンが公開されました！');
          loadArtifactList();
        })
        .withFailureHandler(function (err) {
          uploadState.busy = false;
        btn.disabled = false;
          btn.textContent = '社内へ公開する';
          showToast('通信エラー: ' + err.message);
        })
        .apiUploadVersion(uploadState.updateArtifactId, uploadState.htmlContent);

    } else {
      // 新規登録
      var title = document.getElementById('input-title').value.trim();
      if (!title) {
        showToast('タイトルを入力してください');
        uploadState.busy = false;
        btn.disabled = false;
        btn.textContent = '社内へ公開する';
        return;
      }
      var desc = document.getElementById('input-desc').value.trim();
      var principals = [];
      if (uploadState.selectedAcl === 'list') {
        principals = document.getElementById('input-principals').value
          .split(/[\r\n,]+/)
          .map(function (s) { return s.trim(); })
          .filter(Boolean);
        if (principals.length === 0) {
          showToast('限定公開のメールアドレスを1件以上入力してください');
          uploadState.busy = false;
        btn.disabled = false;
          btn.textContent = '社内へ公開する';
          return;
        }
      }

      google.script.run
        .withSuccessHandler(function (res) {
          uploadState.busy = false;
        btn.disabled = false;
          btn.textContent = '社内へ公開する';
          if (!res.ok) {
            showToast('公開失敗: ' + res.error);
            return;
          }
          closeDrawer();
          showToast('アーティファクトを正常に公開しました！');
          loadArtifactList();
        })
        .withFailureHandler(function (err) {
          uploadState.busy = false;
        btn.disabled = false;
          btn.textContent = '社内へ公開する';
          showToast('通信エラー: ' + err.message);
        })
        .apiUploadArtifact({
          title: title,
          description: desc,
          visibility: uploadState.selectedAcl,
          htmlContent: uploadState.htmlContent,
          principals: principals
        });
    }
  }

  // リンクコピー
  function copyLink(artifactId) {
    const base = (typeof APP_URL !== 'undefined' && APP_URL ? String(APP_URL) : getAppBaseUrl()).split('?')[0].split('#')[0].replace(/\/dev$/, '/exec');
    copyText_(base + '?a=' + encodeURIComponent(artifactId));
  }

  // アーティファクト設定編集モーダル（アーティファクト名・説明・用途・公開範囲）
  // ACLの追加・権限変更・削除は都度サーバーへ送らず、モーダル内でのみ保持する
  // 下書き（settingsAclDraft.staged）に反映し、「保存」クリック時にまとめて反映する
  var settingsAclDraft = { original: [], staged: [], requestId: 0, loaded: false, saving: false, artifactId: '', custodian: '', refreshListOnClose: false };
  var updateState = { file: null, htmlContent: '', fileReadId: 0, busy: false, returnToSettings: false };

  function openEditModal(artifactId) {
    openSettingsModal(artifactId);
  }

  function openSettingsModal(artifactId) {
    if (settingsAclDraft.saving) return;
    const art = currentArtifacts.find(a => a.artifactId === artifactId);
    if (!art || !art.isEditor) return;
    document.getElementById('settings-artifact-id').textContent = artifactId;
    const requestId = ++settingsAclDraft.requestId;
    settingsAclDraft.artifactId = artifactId;
    settingsAclDraft.custodian = String(art.custodian || '').toLowerCase();
    settingsAclDraft.loaded = false;
    settingsAclDraft.original = [];
    settingsAclDraft.staged = [];
    settingsAclDraft.refreshListOnClose = false;
    document.getElementById('settings-title').value = art.title || '';
    document.getElementById('settings-desc').value = art.description || '';
    document.getElementById('settings-visibility').value = art.visibility || 'all';
    document.getElementById('settingsModal-status').textContent = 'メンバーを読み込んでいます...';
    toggleSettingsAclSection();
    renderAclRows([]);
    showDialog_('settingsModal');
    setDialogDisabled_('settingsModal', true);
    google.script.run.withSuccessHandler(function (res) {
      if (requestId !== settingsAclDraft.requestId) return;
      if (!res || !res.ok) { aclLoadFailed_((res && res.error) || '応答を取得できませんでした'); return; }
      const acls = (res.data.acls || []).filter(a => String(a.email).toLowerCase() !== settingsAclDraft.custodian).map(a => ({email: a.email, role: a.role}));
      settingsAclDraft.original = acls;
      settingsAclDraft.staged = acls.map(a => ({email: a.email, role: a.role}));
      settingsAclDraft.loaded = true;
      renderAclRows(settingsAclDraft.staged);
      setDialogDisabled_('settingsModal', false);
      document.getElementById('settingsModal-status').textContent = '管理責任者: ' + (settingsAclDraft.custodian || '未設定') + '（常に管理権限を保持します）';
    }).withFailureHandler(function (error) {
      if (requestId !== settingsAclDraft.requestId) return;
      aclLoadFailed_(error.message);
    }).apiGetAcl(artifactId);
  }

  function aclLoadFailed_(message) {
    setDialogDisabled_('settingsModal', false);
    document.getElementById('btn-save-settings').disabled = true;
    document.getElementById('settingsModal-status').textContent = 'メンバー取得に失敗しました: ' + message + '。閉じて再度開いてください。';
  }

  function toggleSettingsAclSection() {
    var visibility = document.getElementById('settings-visibility').value;
    document.getElementById('settings-acl-section').style.display = (visibility === 'list') ? 'block' : 'none';
  }

  // 限定公開メンバー管理（下書き settingsAclDraft.staged をその場で描画するのみ。サーバー通信はしない）
  // DOM APIで構築する（メールアドレスをHTML/JS属性文字列に埋め込むと、
  // escapeHtmlしていても onclick 属性内のJS文字列リテラルとしては保護されず
  // 保存型XSSになりうるため、テキストノード代入とaddEventListenerのみを使う）
  function renderAclRows(acls) {
    var container = document.getElementById('settings-acl-rows');
    container.textContent = '';
    if (!acls || acls.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'acl-empty';
      empty.textContent = 'メンバーが登録されていません';
      container.appendChild(empty);
      return;
    }
    acls.forEach(function (a) {
      var email = a.email || '';
      var row = document.createElement('div');
      row.className = 'acl-member-row';

      var span = document.createElement('span');
      span.className = 'acl-member-email';
      span.title = email;
      span.textContent = email;

      var select = document.createElement('select');
      select.className = 'acl-role-select';
      [['viewer', '閲覧のみ'], ['editor', '編集可']].forEach(function (opt) {
        var option = document.createElement('option');
        option.value = opt[0];
        option.textContent = opt[1];
        if (a.role === opt[0]) option.selected = true;
        select.appendChild(option);
      });
      select.addEventListener('change', function () {
        stageAclRoleChange(email, select.value);
      });

      var btn = document.createElement('button');
      btn.className = 'acl-remove-btn';
      btn.setAttribute('aria-label', '削除');
      btn.textContent = '×';
      btn.addEventListener('click', function () {
        stageAclRemoval(email);
      });

      row.appendChild(span);
      row.appendChild(select);
      row.appendChild(btn);
      container.appendChild(row);
    });
  }

  function isValidAclEmail_(email) {
    return /^[^\s'"<>@]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(email);
  }

  function addAclMember() {
    if (!settingsAclDraft.loaded || settingsAclDraft.saving) return;
    var emailInput = document.getElementById('settings-acl-email-input');
    var email = emailInput.value.trim().toLowerCase();
    var role = document.getElementById('settings-acl-role-select').value;

    if (!isValidAclEmail_(email)) {
      showToast('有効なメールアドレスを入力してください');
      return;
    }

    if (email === settingsAclDraft.custodian) { showToast('管理責任者は常に管理権限を保持します'); return; }
    var existing = settingsAclDraft.staged.filter(function (m) { return m.email.toLowerCase() === email; })[0];
    if (existing) {
      existing.role = role;
    } else {
      settingsAclDraft.staged.push({ email: email, role: role });
    }
    emailInput.value = '';
    renderAclRows(settingsAclDraft.staged);
  }

  function stageAclRoleChange(email, role) {
    if (!settingsAclDraft.loaded || settingsAclDraft.saving) return;
    var member = settingsAclDraft.staged.filter(function (m) { return m.email === email; })[0];
    if (member) member.role = role;
  }

  function stageAclRemoval(email) {
    if (!settingsAclDraft.loaded || settingsAclDraft.saving) return;
    settingsAclDraft.staged = settingsAclDraft.staged.filter(function (m) { return m.email !== email; });
    renderAclRows(settingsAclDraft.staged);
  }

  function closeSettingsModal() {
    if (settingsAclDraft.saving || updateState.busy || document.getElementById('uploadModal').classList.contains('show')) return;
    ++settingsAclDraft.requestId;
    settingsAclDraft.loaded = false;
    var refreshList = settingsAclDraft.refreshListOnClose;
    settingsAclDraft.refreshListOnClose = false;
    hideDialog_('settingsModal');
    if (refreshList) loadArtifactList(false, focusSettingsOpener_);
  }

  function focusSettingsOpener_() {
    var artifactId = settingsAclDraft.artifactId;
    var candidates = document.querySelectorAll('[data-settings-artifact-id]');
    for (var i = 0; i < candidates.length; i++) {
      if (candidates[i].getAttribute('data-settings-artifact-id') === artifactId && candidates[i].getClientRects().length) {
        candidates[i].focus();
        return;
      }
    }
  }

  function saveSettings() {
    if (!settingsAclDraft.loaded || settingsAclDraft.saving) return;
    const title = document.getElementById('settings-title').value.trim();
    const description = document.getElementById('settings-desc').value.trim();
    const visibility = document.getElementById('settings-visibility').value;
    if (!title) { showToast('タイトルを入力してください'); return; }
    const artifactId = settingsAclDraft.artifactId;
    const acls = settingsAclDraft.staged.map(a => ({email: a.email, role: a.role}));
    settingsAclDraft.saving = true;
    setDialogDisabled_('settingsModal', true);
    document.getElementById('btn-save-settings').textContent = '保存中...';
    function finish(error) {
      settingsAclDraft.saving = false;
      setDialogDisabled_('settingsModal', false);
      document.getElementById('btn-save-settings').textContent = '設定を保存';
      if (error) {
        document.getElementById('settingsModal-status').textContent = '保存失敗: ' + error + '。入力内容を保持しています。';
        return;
      }
      settingsAclDraft.refreshListOnClose = true;
      closeSettingsModal();
      showToast('設定を保存しました');
    }
    google.script.run.withSuccessHandler(function (res) {
      finish(res && res.ok ? '' : (res && res.error) || '応答を取得できませんでした');
    }).withFailureHandler(error => finish(error.message))
      .apiSaveArtifactSettings(artifactId, title, description, visibility, acls);
  }

  function copySettingsArtifactId() {
    copyText_(settingsAclDraft.artifactId, 'UUIDをコピーしました', '次のUUIDをコピーしてください');
  }

  function handleDeleteArtifact() {
    const artifactId = settingsAclDraft.artifactId;
    if (settingsAclDraft.saving || !settingsAclDraft.loaded) return;
    if (!confirm('このアーティファクトを無効化（削除）しますか？ 社員がアクセスできなくなります。編集中の設定は保存されません。')) return;
    settingsAclDraft.saving = true;
    setDialogDisabled_('settingsModal', true);
    function finish(error) {
      settingsAclDraft.saving = false;
      setDialogDisabled_('settingsModal', false);
      document.getElementById('btn-save-settings').disabled = !settingsAclDraft.loaded;
      if (error) { document.getElementById('settingsModal-status').textContent = '削除失敗: ' + error; return; }
      settingsAclDraft.refreshListOnClose = true;
      closeSettingsModal();
      showToast('アーティファクトを無効化しました');
    }
    google.script.run.withSuccessHandler(res => finish(res && res.ok ? '' : (res && res.error) || '応答を取得できませんでした'))
      .withFailureHandler(error => finish(error.message)).apiDeleteArtifact(artifactId);
  }

  function setupUpdateDropzone() {
    var dropzone = document.getElementById('update-dropzone');
    if (!dropzone) return;
    ['dragenter', 'dragover'].forEach(function (eventName) {
      dropzone.addEventListener(eventName, function (event) { event.preventDefault(); event.stopPropagation(); dropzone.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(function (eventName) {
      dropzone.addEventListener(eventName, function (event) { event.preventDefault(); event.stopPropagation(); dropzone.classList.remove('dragover'); });
    });
    dropzone.addEventListener('drop', function (event) { handleUpdateFileInputChange(event.dataTransfer && event.dataTransfer.files); });
    document.getElementById('uploadModal').addEventListener('dragover', function (event) { if (!event.target.closest('#update-dropzone')) event.preventDefault(); });
    document.getElementById('uploadModal').addEventListener('drop', function (event) { if (!event.target.closest('#update-dropzone')) event.preventDefault(); });
  }

  function setupChangeNoteCounter_() {
    var input = document.getElementById('update-change-note');
    if (!input || typeof input.addEventListener !== 'function') return;
    input.addEventListener('input', updateChangeNoteCounter_);
    updateChangeNoteCounter_();
  }

  function updateChangeNoteCounter_() {
    document.getElementById('update-change-note-count').textContent = document.getElementById('update-change-note').value.length;
  }

  function openNewVersionModal(fromSettings) {
    if (updateState.busy || settingsAclDraft.saving || !settingsAclDraft.loaded) return;
    resetUpdateModal();
    updateState.returnToSettings = !!fromSettings;
    var settings = document.getElementById('settingsModal');
    if (updateState.returnToSettings) { settings.inert = true; settings.classList.add('artifact-dialog-behind'); }
    document.getElementById('btn-close-version').textContent = updateState.returnToSettings ? '設定へ戻る' : 'キャンセル';
    showDialog_('uploadModal');

  function closeNewVersionModal() {
    if (updateState.busy) return;
    ++updateState.fileReadId;
    var returnToSettings = updateState.returnToSettings;
    hideDialog_('uploadModal');
    updateState.returnToSettings = false;
    if (returnToSettings) {
      var settings = document.getElementById('settingsModal');
      settings.inert = false;
      settings.classList.remove('artifact-dialog-behind');
      document.getElementById('btn-settings-new-version').focus();
    }
  }

  function resetUpdateModal() {
    ++updateState.fileReadId;
    updateState.file = null;
    updateState.htmlContent = '';
    document.getElementById('update-file-input').value = '';
    document.getElementById('update-file-label').textContent = 'HTMLファイルを選択またはドロップ';
    document.getElementById('update-file-sub').textContent = 'クリックしてファイルを選択 (.html / .htm)';
    document.getElementById('updateScanCard').style.display = 'none';
    document.getElementById('update-change-note').value = '';
    document.getElementById('update-version-status').textContent = '';
    updateChangeNoteCounter_();
    var btn = document.getElementById('btn-submit-version');
    btn.disabled = true;
    btn.textContent = '新しいバージョンを公開する';
  }

  function handleUpdateFileInputChange(files) { if (files && files.length) processUpdateFile(files[0]); }

  function resetUpdateFilePreview_() {
    document.getElementById('update-file-label').textContent = 'HTMLファイルを選択またはドロップ';
    document.getElementById('update-file-sub').textContent = 'クリックしてファイルを選択 (.html / .htm)';
    document.getElementById('updateScanCard').style.display = 'none';
  }

  function processUpdateFile(file) {
    if (updateState.busy) return;
    const readId = ++updateState.fileReadId;
    updateState.htmlContent = '';
    updateState.file = null;
    document.getElementById('btn-submit-version').disabled = true;
    if (!file.name.match(/\.(html|htm)$/i)) { showToast('単一のHTMLファイル (.html / .htm) を選択してください'); resetUpdateFilePreview_(); return; }
    if (file.size > (Number(appConfig.maxHtmlSizeKb) || 1024) * 1024) { showToast('ファイルサイズが上限を超えています'); resetUpdateFilePreview_(); return; }
    updateState.file = file;
    document.getElementById('update-file-label').textContent = file.name;
    document.getElementById('update-file-sub').textContent = Math.round(file.size / 1024) + ' KB · 準備完了';
    var reader = new FileReader();
    reader.onload = function (event) {
      if (readId !== updateState.fileReadId) return;
      updateState.htmlContent = event.target.result;
      previewUpdateScanResult(updateState.htmlContent, file.size);
      document.getElementById('btn-submit-version').disabled = false;
    };
    reader.onerror = reader.onabort = function () {
      if (readId !== updateState.fileReadId) return;
      updateState.htmlContent = '';
      document.getElementById('btn-submit-version').disabled = true;
      showToast('ファイルの読み込みに失敗しました');
    };
    reader.readAsText(file);
  }

  function previewUpdateScanResult(html, sizeBytes) {
    document.getElementById('updateScanCard').style.display = 'block';
    document.getElementById('update-scan-filesize').textContent = (sizeBytes / 1024).toFixed(1) + ' KB (' + (sizeBytes <= 90 * 1024 ? '高速キャッシュ適用' : 'Drive直読み') + ')';
    var network = document.getElementById('update-scan-network-status');
    if (/\b(fetch|XMLHttpRequest|WebSocket|sendBeacon|EventSource)\b/i.test(html)) { network.textContent = '外部通信API検出あり'; network.style.color = 'var(--badge-warn-text)'; }
    else { network.textContent = '検出なし（安全性の保証ではありません）'; network.style.color = 'var(--badge-safe-text)'; }
    document.getElementById('update-scan-auth-status').textContent = '親画面から分離して実行';
    document.getElementById('update-scan-status-title').textContent = '簡易検査プレビュー';
  }

  function submitNewVersion() {
    if (updateState.busy || !updateState.htmlContent) { if (!updateState.htmlContent) showToast('HTMLファイルを選択してください'); return; }
    var btn = document.getElementById('btn-submit-version');
    var note = document.getElementById('update-change-note').value.trim();
    var status = document.getElementById('update-version-status');
    btn.disabled = true;
    btn.textContent = '公開処理中...';
    status.textContent = '新しいバージョンを保存しています...';
    updateState.busy = true;
    setDialogDisabled_('uploadModal', true);
    document.getElementById('uploadModal').querySelectorAll('[data-dialog-close]').forEach(function (control) { control.disabled = true; });
    google.script.run.withSuccessHandler(function (res) {
      updateState.busy = false;
      setDialogDisabled_('uploadModal', false);
      document.getElementById('uploadModal').querySelectorAll('[data-dialog-close]').forEach(function (control) { control.disabled = false; });
      btn.textContent = '新しいバージョンを公開する';
      if (!res || !res.ok) { status.textContent = '更新失敗: ' + ((res && res.error) || '応答を取得できませんでした'); return; }
      closeNewVersionModal();
      showToast('新しいバージョンが公開されました');
      settingsAclDraft.refreshListOnClose = true;
    }).withFailureHandler(function (error) {
      updateState.busy = false;
      setDialogDisabled_('uploadModal', false);
      document.getElementById('uploadModal').querySelectorAll('[data-dialog-close]').forEach(function (control) { control.disabled = false; });
      btn.textContent = '新しいバージョンを公開する';
      status.textContent = '通信エラー: ' + error.message;
    }).apiUploadVersion(settingsAclDraft.artifactId, updateState.htmlContent, note);
  }

  // トースト
  function showToast(msg) {
    var toast = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    toast.classList.add('show');
    setTimeout(function () {
      toast.classList.remove('show');
    }, 3000);
  }

  // XSSエスケープ
  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
